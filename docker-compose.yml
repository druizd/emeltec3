# Stack Emeltec Platform.
# Variables compartidas se leen desde el .env raíz (ver .env.example).
# Cada API toma sus secretos sensibles desde su propio .env por servicio.

x-db-env: &db-env
  DB_HOST: timescaledb
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB}
  DB_USER: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}

x-healthcheck-main-api: &healthcheck-main-api
  test:
    - CMD-SHELL
    - >-
      node -e "fetch('http://localhost:3000/api/v2/health/live')
      .then(r => process.exit(r.ok ? 0 : 1))
      .catch(() => process.exit(1))"
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

x-healthcheck-auth-api: &healthcheck-auth-api
  test:
    - CMD-SHELL
    - >-
      node -e "fetch('http://localhost:3001/api/health')
      .then(r => process.exit(r.ok ? 0 : 1))
      .catch(() => process.exit(1))"
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: emeltec-db
    # effective_cache_size no aloca memoria: es lo que el planner cree que hay
    # de caché entre shared_buffers y el page cache del sistema. En 768MB le
    # estábamos diciendo que hay poca, y con eso prefiere seq scan antes que
    # index scan — justo el plan que hace lento a equipo_1min.
    #
    # max_connections baja de 100 a 60. El techo teórico de los pools es 46
    # (main-api 20, auth-api 10, ftpconsumer 8, linux-db-api 8) y el uso real
    # son 26 conexiones, así que 60 acota el peor caso sin quedar corto.
    #
    # Pero max_connections NO solo limita conexiones: también dimensiona la
    # tabla de locks, que se reparte como
    #     max_locks_per_transaction × (max_connections + max_prepared_transactions)
    # Bajarlo de 100 a 60 dejó 7.680 slots donde antes había 12.800, y el
    # deploy del 24-09-2026 murió con `out of shared memory` aplicando las
    # migraciones: cada chunk y cada índice de un hypertable pide su propio
    # lock, y son miles. Por eso los locks suben de 128 a 256, que deja 15.360
    # slots — un 20% más que los 12.800 originales. El costo en memoria
    # compartida son unos pocos MB de los 2 GB del container.
    command: >
      postgres
      -c max_locks_per_transaction=256
      -c shared_buffers=256MB
      -c effective_cache_size=1536MB
      -c work_mem=4MB
      -c max_connections=60
    ports:
      # EMT-H03: la BD NO debe quedar expuesta a 0.0.0.0. Solo loopback
      # (acceso local / túnel SSH). Los servicios la alcanzan por red interna.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./infra-db/init-db:/docker-entrypoint-initdb.d
    # El 24-09-2026 el cgroup mató backends de postgres siete veces en una hora
    # (10:40, 10:45, 10:53, 11:04, 11:11, 11:37, 11:41). Cada kill fuerza el
    # crash recovery de todo el cluster, y como el postmaster es el PID 1 y
    # sobrevive, el container nunca se reinicia: `docker ps` decía "Up 40 hours
    # (healthy)" con RestartCount=0 mientras la base se caía cada diez minutos.
    # La única señal externa es `docker inspect --format '{{.State.OOMKilled}}'`.
    #
    # Con 1024m la base vivía en 1021 MiB (99,7%). La VM tiene 3862 MiB reales
    # (4 GiB menos lo que reserva el kernel) y los otros ocho containers usan
    # 166 MiB entre todos, así que 2048m deja ~1,6 GB para el sistema y el page
    # cache. Los límites del resto quedan como están: son topes que nunca se
    # rozaron en 19 horas de operación.
    mem_limit: 2048m
    mem_reservation: 1024m
    pids_limit: 150
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 5

  main-api:
    build: ./main-api
    image: ghcr.io/druizd/emeltec3/main-api:${IMAGE_TAG:-latest}
    container_name: emeltec-api
    ports:
      # EMT-H03: detrás del nginx de borde (proxy a 127.0.0.1:3000). Loopback.
      - '127.0.0.1:${MAIN_API_HOST_PORT:-3000}:3000'
    env_file:
      - ./.env
    volumes:
      # Credenciales GCS para el exporter DGA→GCS (solicitado por CCU_Central).
      # El service account JSON va en ./.secrets/ del host (gitignored) y se
      # monta read-only. DGA_GCS_KEY_FILE en .env debe apuntar a /app/secrets/<archivo>.
      # La carpeta ./.secrets debe existir antes de `docker compose up`.
      - ./.secrets:/app/secrets:ro
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3000
      CSVCONSUMER_HOST: csvconsumer
      CSVCONSUMER_PORT: 50051
      FTPCONSUMER_HOST: ftpconsumer
      FTPCONSUMER_PORT: 50061
      AUTH_API_URL: http://auth-api:3001
      # Workers aprobados 17-07-2026 (retención Ley 21.719, alertas de audit
      # log, contadores materializados). Apagables por .env del host sin
      # tocar este archivo.
      ENABLE_RETENTION_WORKER: ${ENABLE_RETENTION_WORKER:-true}
      ENABLE_AUDIT_ALERTS_WORKER: ${ENABLE_AUDIT_ALERTS_WORKER:-true}
      ENABLE_CONTADORES_DAILY_WORKER: ${ENABLE_CONTADORES_DAILY_WORKER:-true}
      # Hops de proxy confiables (nginx host + nginx contenedor) para que
      # req.ip sea la IP real del cliente en el audit_log.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *healthcheck-main-api
    mem_limit: 512m
    mem_reservation: 256m
    pids_limit: 80
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped

  linux-db-api:
    build: ./linux-db-api
    image: ghcr.io/druizd/emeltec3/linux-db-api:${IMAGE_TAG:-latest}
    container_name: emeltec-linux-db-api
    ports:
      # EMT-H03/H02: consumido cross-host (procesadores en otra máquina), por eso
      # NO se oculta. Mitigar con: firewall/NSG allowlist al/los host(s) emisor(es)
      # + INTERNAL_API_KEY obligatoria (fail-closed, ya aplicado) + TLS.
      # Ver docs/security-audit/RUNBOOK-FASE-1-puertos-cross-host.md
      - '${LINUX_DB_API_HOST_PORT:-3010}:3010'
    env_file:
      - ./.env
    environment:
      <<: *db-env
      PORT: 3010
      RUST_LOG: info
      PLC_COMMAND_LEASE_SEC: ${PLC_COMMAND_LEASE_SEC:-60}
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://localhost:3010/health >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 128m
    mem_reservation: 64m
    pids_limit: 30
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: emeltec-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    mem_reservation: 32m
    pids_limit: 20
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped

  auth-api:
    build: ./auth-api
    image: ghcr.io/druizd/emeltec3/auth-api:${IMAGE_TAG:-latest}
    container_name: emeltec-auth
    ports:
      # EMT-H03: detrás del nginx de borde (proxy a 127.0.0.1:3001). Loopback.
      - '127.0.0.1:${AUTH_API_HOST_PORT:-3001}:3001'
    env_file:
      - ./.env
    environment:
      <<: *db-env
      NODE_ENV: production
      PORT: 3001
      MAIN_API_URL: http://main-api:3000
      # Dos proxies confiables (borde + contenedor frontend) — ver main-api.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
    depends_on:
      timescaledb:
        condition: service_healthy
      main-api:
        condition: service_healthy
    healthcheck: *healthcheck-auth-api
    mem_limit: 256m
    mem_reservation: 128m
    pids_limit: 80
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped

  frontend-angular:
    build:
      context: .
      dockerfile: frontend-angular/Dockerfile
    image: ghcr.io/druizd/emeltec3/frontend-angular:${IMAGE_TAG:-latest}
    container_name: emeltec-frontend
    ports:
      # EMT-H03: detrás del nginx de borde (proxy a 127.0.0.1:5173). Loopback.
      - '127.0.0.1:${FRONTEND_HOST_PORT:-5173}:80'
    depends_on:
      main-api:
        condition: service_healthy
      auth-api:
        condition: service_healthy
    mem_limit: 32m
    mem_reservation: 16m
    pids_limit: 20
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  landing-emeltec:
    build: ./landing-emeltec
    image: ghcr.io/druizd/emeltec3/landing-emeltec:${IMAGE_TAG:-latest}
    container_name: emeltec-landing
    ports:
      - '127.0.0.1:${LANDING_HOST_PORT:-8082}:80'
    mem_limit: 32m
    mem_reservation: 16m
    pids_limit: 20
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  csvconsumer:
    build:
      context: ./grpc-pipeline
      dockerfile: csvconsumer-rust.Dockerfile
    image: ghcr.io/druizd/emeltec3/csvconsumer:${IMAGE_TAG:-latest}
    container_name: emeltec-csvconsumer
    ports:
      # EMT-H03/H01: ingesta gRPC consumida cross-host (procesador CSV en otra
      # máquina). Mitigar con firewall/NSG allowlist + auth (interceptor/mTLS) + TLS.
      # Ver docs/security-audit/RUNBOOK-FASE-1-puertos-cross-host.md
      - '${CSVCONSUMER_HOST_PORT:-50051}:50051'
    environment:
      <<: *db-env
      GRPC_PORT: 50051
      WAL_DB_PATH: /data/csvconsumer-wal.db
    volumes:
      # WAL SQLite: persiste registros pendientes entre reinicios del contenedor.
      # Sin este volumen, los datos en cola in-memory se pierden al reiniciar.
      - csvconsumer_wal:/data
    depends_on:
      timescaledb:
        condition: service_healthy
    mem_limit: 64m
    mem_reservation: 32m
    pids_limit: 30
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/localhost/50051" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ftpconsumer:
    build:
      context: ./ftp-pipeline
      dockerfile: ftpconsumer-rust.Dockerfile
    image: ghcr.io/druizd/emeltec3/ftpconsumer:${IMAGE_TAG:-latest}
    container_name: emeltec-ftpconsumer
    ports:
      # EMT-H03/H01: ingesta gRPC consumida cross-host (procesador FTP en otra
      # máquina). Mitigar con firewall/NSG allowlist + auth (interceptor/mTLS) + TLS.
      # Ver docs/security-audit/RUNBOOK-FASE-1-puertos-cross-host.md
      - '${FTPCONSUMER_HOST_PORT:-50061}:50061'
    environment:
      <<: *db-env
      FTP_CONSUMER_PORT: 50061
      RUST_LOG: info
    depends_on:
      timescaledb:
        condition: service_healthy
    mem_limit: 64m
    mem_reservation: 32m
    pids_limit: 30
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/localhost/50061" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  timescale_data:
  redis_data:
  csvconsumer_wal:
