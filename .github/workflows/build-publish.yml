name: Build and publish images

# Buildea las imágenes de los servicios en runner GitHub-hosted y las publica en
# GHCR (ghcr.io/druizd/emeltec3/<servicio>). El deploy en la VM ya NO buildea:
# deploy-selfhosted.yml se encadena a este workflow (workflow_run) y solo hace
# `docker compose pull` + `up --no-build`. Así el build pesado (Angular/Rust) no
# satura la RAM de la VM productiva.

on:
  push:
    branches:
      - main
    # En repo publico los runners GitHub-hosted son gratis; en privado consumen
    # cuota. Un push de solo documentacion gastaba un build completo de los 8
    # servicios (~5 min) para publicar imagenes identicas a las anteriores.
    # paths-ignore solo omite el run si TODOS los archivos del push calzan, asi
    # que un commit que mezcle docs y codigo si buildea.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitattributes'
      - '.prettierignore'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: build-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io/druizd/emeltec3
      SERVICES: >-
        main-api auth-api linux-db-api frontend-angular
        landing-emeltec csvconsumer ftpconsumer

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare example env files
        run: |
          cp .env.example .env
          cp main-api/.env.example main-api/.env
          cp auth-api/.env.example auth-api/.env

      - name: Validate compose config
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Bake lee los mismos targets de docker-compose.yml, pero con caché de
      # capas en el backend de GitHub Actions: sin ella cada push a main
      # reconstruía los 7 servicios desde cero (~220 s). Un scope por servicio
      # para que no se pisen entre sí; mode=max guarda también las etapas
      # intermedias (deps de npm/pnpm, builder de Rust), que es lo que más tarda.
      # Esta caché la escribe solo main; el CI de los PRs la lee.
      # load: las deja en el docker local para que los pasos de push sigan igual.
      - name: Build images (tag latest)
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          IMAGE_TAG: latest
        with:
          source: .
          files: docker-compose.yml
          # Misma lista que SERVICES.
          targets: main-api,auth-api,linux-db-api,frontend-angular,landing-emeltec,csvconsumer,ftpconsumer
          load: true
          provenance: false
          set: |
            main-api.cache-from=type=gha,scope=main-api
            main-api.cache-to=type=gha,scope=main-api,mode=max
            auth-api.cache-from=type=gha,scope=auth-api
            auth-api.cache-to=type=gha,scope=auth-api,mode=max
            linux-db-api.cache-from=type=gha,scope=linux-db-api
            linux-db-api.cache-to=type=gha,scope=linux-db-api,mode=max
            frontend-angular.cache-from=type=gha,scope=frontend-angular
            frontend-angular.cache-to=type=gha,scope=frontend-angular,mode=max
            landing-emeltec.cache-from=type=gha,scope=landing-emeltec
            landing-emeltec.cache-to=type=gha,scope=landing-emeltec,mode=max
            csvconsumer.cache-from=type=gha,scope=csvconsumer
            csvconsumer.cache-to=type=gha,scope=csvconsumer,mode=max
            ftpconsumer.cache-from=type=gha,scope=ftpconsumer
            ftpconsumer.cache-to=type=gha,scope=ftpconsumer,mode=max

      - name: Push :latest
        env:
          IMAGE_TAG: latest
        run: docker compose push $SERVICES

      - name: Tag and push :<sha>
        run: |
          for svc in $SERVICES; do
            docker tag "$REGISTRY/$svc:latest" "$REGISTRY/$svc:${GITHUB_SHA}"
            docker push "$REGISTRY/$svc:${GITHUB_SHA}"
          done
