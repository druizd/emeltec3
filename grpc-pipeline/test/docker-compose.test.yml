services:
  postgres-test:
    image: postgres:16-alpine
    container_name: csvconsumer-test-db
    environment:
      POSTGRES_DB: db_test
      POSTGRES_USER: admin_test
      POSTGRES_PASSWORD: test123
    volumes:
      - ./init-test.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin_test']
      interval: 3s
      timeout: 3s
      retries: 10

  csvconsumer-test:
    build:
      context: ..
      dockerfile: csvconsumer-rust.Dockerfile
    container_name: csvconsumer-test-app
    environment:
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_NAME: db_test
      DB_USER: admin_test
      DB_PASSWORD: test123
      GRPC_PORT: 50051
      WAL_DB_PATH: /data/test-wal.db
    volumes:
      - csvconsumer_test_wal:/data
    ports:
      - '50052:50051'
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  csvconsumer_test_wal:
